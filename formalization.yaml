        identified #2 as superseded by #3, and closed #2 with an explanatory comment.

        2. Hypothesis-driven minimization. The human suspected that much of the partial-zeta bridge was
        unnecessary if the code used the local `DedekindZeta` deliverables directly rather than
        reconstructing the old partial-zeta Mellin axiom under the new name
