      prompting_notes: >-
        Prompting notes for the separate Mellin axiom-removal effort:

        1. Investigate, then plan, then orchestrate. The session opened by mapping both the consumer
        (the `sumProduct_false` axiom and its sole use site) and the `DedekindZeta` library via
        parallel read-only explore agents, before any proving; the human asked to "plan your work then
        use opus subagents liberally" with the orchestrator planning and verifying rather than running
        the proof searches itself.

        2. The class-number-formula linchpin. The human pointed out that Mathlib already has the
        analytic class number formula; this supplied the per-class pole residue `2^rR/w` (via
        `dedekindZeta_residue` + `completedDedekindZeta_eq`) with no geometric volume computation,
        turning the one genuinely hard gap into routine work.

        3. Decomposition into subagent-sized lemmas. Focused opus subagents each owned one piece —
        normalization (`partialCompletedZeta` as a real part of the completed zeta), the residue
        identity, tail nonnegativity, and the analytic crux (the theta-inversion-under-the-integral
        reflection) — each compiling iteratively against the library; the orchestrator integrated and
        verified `#print axioms`.

        4. Initial faithful target, then minimization. The original discharge targeted the exact axiom
        statement (the clean pole + nonnegative-tail Mellin representation). A later minimization pass
        kept only the inequality the consumer uses, `partialCompletedZetaResidue_le`, while preserving
        the same one-axiom headline result.

        5. Incorporate, then minimize by metaprogramming. After incorporating the modules, a Lean
        metaprogram computed the exact declaration-level dependency closure of `sumProduct_false` (traversing
        compiled proof terms) to delete unused declarations — the Euler-product deliverable, the
        functional equation, the abstract Mellin-principle residue/FE lemmas, and a `theta`
        sub-development — with the build used to restore the few `@[simp]` lemmas referenced only by
        name. Commits stayed human-gated and scoped.
