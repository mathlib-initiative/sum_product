# formalization.yaml (v0.3): repo-root metadata for formalization projects.
# Schema: https://github.com/mathlib-initiative/formalization.yaml

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "The sum-product conjecture is false for real numbers (Lean 4 / Mathlib formalization)"
  # Individual names are Formal Frontier Team members directly involved in the autoformalization,
  # listed alphabetically by last name.
  authors:
    - "Formal Frontier Team"
    - "Matthew Ballard"
    - "Fabian Glöckle"
    - "Bhavik Mehta"
    - "Adam Topaz"
  license: "Apache-2.0"

# sources - what was formalized. List of papers/textbooks/blueprints.
sources:
  # Primary target: the paper whose Theorem 1.1 is formalized as `sumProduct_false`.
  - title: "The sum-product conjecture is false for real numbers"
    authors: ["Thomas F. Bloom", "Will Sawin", "Carl Schildkraut", "Dmitrii Zhelezov"]
    id: "arXiv:2605.28781v1"
    type: "preprint"
    license: "CC-BY-4.0"
    author_contacted: "yes"     # Thomas F. Bloom and Will Sawin were contacted.
    prior_work: ""              # no earlier formalization built upon
  # Secondary source: bibliographic source for the analytic Dedekind-zeta background used by the
  # in-repository support library.
  - title: "Algebraic Number Theory"
    authors: ["Jürgen Neukirch"]
    id: "ISBN:978-3-540-65399-8"
    type: "book"
    license: "all-rights-reserved"
    author_contacted: "no"          # author deceased (1997)
    prior_work: ""                  # no earlier formalization built upon

# project status
status:
  scope: >-
    The headline real sum-product result (paper Theorem 1.1,
    `SumProduct.sumProduct_false`) and its full Lean proof, conditional on the explicit
    Martinet-towers hypothesis `SumProduct.MartinetTotallyRealTowers` (paper Theorem 3.2).
    The paper's "many sums and products" extension is not formalized. See
    `fidelity.divergences` for the details.
  sorry_count: 0
  sorry_in_definitions: 0
  # `#print axioms SumProduct.sumProduct_false`
  axioms:
    # Lean/Mathlib standard axioms
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
    # The sole classical mathematical input not (yet) in Mathlib is stated faithfully as the
    # explicit theorem hypothesis `SumProduct.MartinetTotallyRealTowers`, not as a Lean axiom.
    # The development's two analytic inputs are proved theorems (so they do not appear in
    # `#print axioms sumProduct_false`):
    #  • the per-ideal residue inequality `partialCompletedZetaResidue_le` (the sole analytic input
    #    behind Lemma 3.1) is proved in `SumProduct.PartialZetaMellin` using the in-repository
    #    `DedekindZeta` library (Hecke theta–Mellin theory, theta inversion law) together with
    #    Mathlib's analytic class number formula `NumberField.dedekindZeta_residue` (which pins the pole residue to 2^rR/w).
    #    `SumProduct.RegulatorBound` applies these inequalities to class representatives and sums →
    #    dedekindZeta_completed_ge_residue → (totally real) dedekindZeta_completed_residue_le →
    #    dedekind_residue_le (with the proved Euler bound ζ_K(2)≤2^d) → Lemma 3.1 regulator_le_discr.
    #  • eq. (3.1) (`hensley_unitBox_volume`, Hensley / Ball–Vaaler cube-slice volume bound) is proved
    #    in `SumProduct.CubeSectionHensley`.
  main_results:
    - declaration: "SumProduct.sumProduct_false"
      file: "SumProduct/Construction.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator/sum_product_false.json"
      literature_dependencies:
        - statement: >-
            Martinet's Theorem 3.2 on asymptotically good totally real towers, formalized as the
            explicit theorem hypothesis `SumProduct.MartinetTotallyRealTowers`.
          source: "The sum-product conjecture is false for real numbers"

