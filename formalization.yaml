      prompting_notes: >-
        Prompting notes for the separate eq-(3.1) axiom-removal effort:

        1. Adversarial audit first. The session opened by asking for a multi-agent
        adversarial audit of the repo along three axes — deviations from the natural-language
        mathematics, Mathlib-idiom optimizations, and structural simplifications — run as a
        Claude Code find/verify/synthesize workflow before any axiom work.

        2. A concurrent Grok attempt, not reused. In parallel, the Grok Build TUI (model
        grok-build-0.1) had been asked to blueprint a replacement for `hensley_unitBox_volume`
        and to attack it with its own agent swarm; it produced a cube-section blueprint but
        doom-looped on the build and was eventually stopped. Its code was rewritten from scratch
        — a Fintype-indexed reduction with a Fourier proof preserving the sharp constants — though
        its cube-section blueprint seeded the approach. Claude was told to take over and finish the
        full proof with no sorry and no weakening, the standing bar being the sharp constants
        `(2r)^{d-1}/√d … 5(2r)^{d-1}/√d`.

        3. Delegating the hard analytic core to Codex. A Claude command that shells out to
        `codex exec` (OpenAI Codex, model gpt-5.5) was used to hand off the Mathlib-gap steps as a
        sequence of self-contained tasks, each naming the exact target, the relevant Mathlib lemmas,
        and the no-sorry/no-weakening bar: a survey of proof routes; the reduction (define
        `cubeSumLaw n`, prove `charFun (cubeSumLaw n) = sinc^n`, cut the volume bound to a
        one-dimensional probability bound); a Parseval-bridge attempt that hit a non-integrability
        wall; the density route (the convolution recursion, the explicit density, `g(0)=½P_n`),
        narrowing to a single Fourier-inversion-at-0 lemma; and the close of that lemma, discharging
        the bridge.

        4. Explicit parallel delegation. The orchestrator was directed to spin off the elementary
        estimate in parallel: a self-contained Claude subagent proved
        `π/√N ≤ ∫(sin t/t)^N ≤ 5π/√N` (~790 lines, via an FTC/Wallis recursion and an even/odd
        tail split) in its own file, while the orchestrator drove the Codex bridge.

        5. Persistence and commit gating, as before. Short nudges carried the long analytic grind;
        commits stayed human-gated and scoped.
    - method: "multi-agent framework"
      models: ["claude-opus-4-8"]
