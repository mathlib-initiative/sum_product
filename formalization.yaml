            statement/audit session: 667 assistant requests and 302,706,283 total
            tokens (48,978 base input, 3,994,802 1h cache writes, 297,174,042 cache
            hits/refreshes, 1,488,461 output; no 5m cache writes). Uses Claude
            Opus 4.8 API list pricing at $5/MTok base input, $10/MTok 1h cache
            write, $0.50/MTok cache hits/refreshes, and $25/MTok output. This is
            an API-equivalent estimate only, not an actual billing record.
          alternate_scope: >-
            Counting the entire continued main JSONL session through 2026-06-02
            plus the audit session gives ≈$467.86 API-equivalent.
        hardware: "API-only"
      notes: >-
        Interactive, human-directed agent sessions (Claude Code). The mathematician
        set the goals, fixed the stable top-level statements, and reviewed/steered;
        the agent stated and proved the lemmas in Lean. Statement-auditing was done in
        a separate session before proof work began.
      prompting_notes: >-
        Freeform observations on the actual prompts used across the Claude Code sessions:

        1. Statements first, no placeholders. The opening prompt directed the agent to
        *state* Theorem 1.1, Lemma 3.1 and Theorem 3.2 (proving them with
        `sorry -- <ref>`) and to fill in Theorem 1.1's proof while leaving 3.1/3.2 as
        referenced sorries. It stressed (verbatim, paraphrased): "It is CRUCIAL that you
        do not use any mathematical placeholders — make *correct* mathematical
        statements, using `sorry -- <ref>` only where needed", and that eq. (3.1) on
        p. 8 may stay a properly-stated sorry. The agent was told to "Start by stating
        Theorem 1.1, Lemma 3.1 and Theorem 3.2 before proceeding further" — i.e. get the
        interface right before any proving.

        2. Stable-statement invariant. A standing constraint, repeated across sessions:
        "you should NOT change the *statements* of `sumProduct_false`,
        `regulator_le_discr` or the Martinet-towers input. Those *statements* must
        remain stable at all times as they have been reviewed for correctness." Proofs
        of 3.1/3.2 could remain sorry/axiom; only the statements were frozen.

        3. Pre-audit of statements. A dedicated, code-read-only session audited the three
        top-level statements for mathematical correctness, edge cases and Lean/Mathlib
        idiosyncrasies ("do not edit any code"), and later a "full audit of this work …
        modulo three axioms that I am allowing".

        4. Open-ended autonomy with persistence. The bulk of proof progress was driven by
        short recurring nudges — "Please continue with the next steps", "continue with
        your recommendation … We want to reach our goal", "Don't give up" — granting the
        agent latitude to add tasks, state intermediate lemmas, and choose tactics, while
        pushing for a genuinely sorry-free proof rather than stopping at scaffolding.

        5. Targeted goals when needed. When progress stalled, prompts named the next
        concrete objective, e.g. "I want lattice_count_add and lattice_count_mult to be
        proven. You can work incrementally, but make real meaningful progress", and later
        "I want you to prove lattice_count_mul".

        6. Explicit commit gating. Commits were never automatic: "make a commit",
        "commit", "Lint, then commit" were issued by the human at chosen checkpoints.

        7. Content-preserving reorganization. A separate prompt asked to clean up
        documentation and split the single file into thematic modules, emphasizing this
        was "a doc change and reorganization only" with the formal content unchanged.

        8. Mathlib steer. A late prompt corrected a scoping assumption — "We *do* have the
        analytic class number formula in mathlib. Do a quick search, and see whether you
        can use it to formalize the proof of Lemma 3.1" — nudging the agent to revisit an
        axiom it had deemed out of reach.

    - method: "agent"
      models: ["claude-opus-4-8", "gpt-5.5", "grok-build-0.1"]
      framework: "Claude Code orchestrator with OpenAI Codex (`codex exec`) and the Grok Build TUI"
