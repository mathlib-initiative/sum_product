# acknowledgements - key Mathlib APIs this formalization builds on.
acknowledgements: >-
  Built on Mathlib; this development relies on and gratefully credits the APIs and contributors
  behind the following pieces.

  Number-field infrastructure, especially the canonical/Minkowski embedding, the fundamental cone,
  `NumberField.dedekindZeta`, and the analytic class number formula
  (`NumberField.dedekindZeta_residue` and `tendsto_sub_one_mul_dedekindZeta_nhdsGT`), is due in
  large part to Xavier Roblot. The class number formula is the linchpin that fixes the partial-zeta
  pole residue at `2^r R / w`.

  The analytic infrastructure used here includes Mathlib's Mellin transform, `Complex.Gamma`,
  L-series API, Fourier analysis, and Poisson summation
  (`Mathlib.Analysis.Fourier.PoissonSummation`, `…SpecialFunctions.Gaussian.PoissonSummation`),
  with substantial contributions by David Loeffler, Heather Macbeth, Michael Stoll, Aaron Anderson,
  Xavier Roblot, Chris Birkbeck, and others. These APIs underlie the theta transformation
  (inversion) law.

  We also thank Thomas Browning for useful discussions.

  Finally, we thank the broader Mathlib community; the formalization rests throughout on Mathlib's
  algebra, analysis, measure theory, topology, and number theory libraries.
