      cost:
        wall_time: "~1 day (2026-06-01)"
        spend_usd: "≈603 (metered; 11,352 model requests, 12,484 tool calls, ~9.1M output + 5.3M reasoning tokens)"
        hardware: "API-only"
      notes: >-
        Built the `DedekindZeta` support library by the custom orchestrator described below — a single
