        incorporated into this repository.
      cost:
        wall_time: "~1 day (2026-06-02)"
        spend_usd: "not separately metered/recorded; subscription-based usage"
        hardware: "API-only"
      notes: >-
        Work discharging the former partial-zeta Mellin axiom; current minimized code exposes the
        needed theorem `partialCompletedZetaResidue_le`, taking the headline theorem from two nonstandard
