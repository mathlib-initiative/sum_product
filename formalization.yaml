# fidelity
fidelity:
  divergences: >-
    Scope: the formalization covers the headline real sum-product result (paper
    Theorem 1.1, as `SumProduct.sumProduct_false`) and its full proof; the paper's
    "many sums and products" extension is not formalized. A single classical, externally-referenced input is
    passed as an explicit theorem hypothesis rather than a Lean axiom: Theorem 3.2 (Martinet's
    asymptotically good totally real towers, `MartinetTotallyRealTowers`), which requires class
    field theory not currently in Mathlib. The development's two analytic inputs are proved theorems:
    the per-ideal residue inequality for the Dedekind zeta:
    `(2^rR/w) ≤ s(s-1)·(DedekindZeta.completedPartialZeta K 𝔞 (s:ℂ)).re` for real
    `s > 1` (`partialCompletedZetaResidue_le`, general number field) — is proved in
    `SumProduct.PartialZetaMellin` using the in-repository `DedekindZeta` library (Hecke
    theta–Mellin theory and the theta inversion law) together with Mathlib's analytic class number
    formula (used to pin the pole residue to `2^rR/w` with no geometric volume computation).
    Equation (3.1) (the Hensley / Ball–Vaaler cube-slice volume bound) is proved in
    `SumProduct.CubeSectionHensley` (`hensley_unitBox_volume`) via the elementary
    sinc-integral route and Fourier inversion. The
    Euler-product bound `ζ_K(2) ≤ 2^d` (`dedekindZeta_two_re_le`) is proved in
    `SumProduct.EulerBound` (the ideal-counting function is multiplicative
    and bounded by the d-fold divisor function, whose Dirichlet series is `riemannZeta^d`; with
    `riemannZeta 2 = π²/6 ≤ 2`). The functional-equation residue bound
    `dedekindZeta_completed_residue_le`, the Louboutin-type residue bound
    `dedekind_residue_le` (`κ_K ≤ 2(2/π)^d√Δ_K`, that bound at s=2), and Lemma 3.1
    (regulator ≤ discriminant, `regulator_le_discr`) are proved
    (in `SumProduct.RegulatorBound`) from the per-ideal residue inequality (plus the proved Euler
    bound), Mathlib's analytic class number formula (`NumberField.dedekindZeta_residue`; for totally
    real K, `κ_K = 2^{d-1}R_K h_K/√Δ_K`), and `h_K ≥ 1`. The two geometry-of-numbers
    lattice-point counts, Lemma 3.5 (`lattice_count_add`) and Lemma 3.7
    (`lattice_count_mult`), are proved. Modeling choices: regulator = `NumberField.Units.regulator`; discriminant
    via `NumberField.discr K : ℤ` (taken in absolute value, equal to Δ_K since totally
    real fields have positive discriminant); degree = `Module.finrank ℚ K`; totally
    real = `NumberField.IsTotallyReal`; sumset/product as `Finset` pointwise `A + A`,
    `A * A`; the exponent `|A|^(2-c)` via `Real.rpow`. "Arbitrarily large" is encoded
    as `∀ N, ∃ A, N ≤ |A| ∧ …`. The auxiliary lattice constants differ from the paper's
    nominal values (verified-correct alternatives c = 1/100, ε = 3/20).

# review status
review:
  status: "self-assessed; agent-audited"
  reviewers: ["Formal Frontier Team", "pi harness / gpt-5.5 xhigh (read-only audit, 2026-05-31)"]
  notes: >-
    Review is self-assessed and agent-audited, not independent external peer review (see the caveat
    below). It comes in two parts, at two different states of the development.

    Statement + proof-path audit (2026-05-31, historical). Dedicated read-only audit sessions —
    Claude Code, plus a fresh pi-harness / gpt-5.5-xhigh pass on 2026-05-31 — checked the
    mathematical fidelity of the frozen top-level statements (Theorem 1.1 `sumProduct_false`,
    Lemma 3.1 `regulator_le_discr`, Theorem 3.2 `MartinetTotallyRealTowers`) and of the proof-path
    statements (`lattice_count_add`, `unit_separation`, `lattice_count_mult`, `lemma_4_1`,
    `theorem_1_2`), confirmed `lake build` and `lake env lean --trust=0 SumProduct.lean`, and ran
    `#print axioms`. This audit PREDATES the June 1–2 discharge of eq. (3.1) and the partial-zeta
    Mellin axiom, so it reflects an earlier (larger) axiom state; the statements it froze are
    unchanged, but its axiom findings are superseded by the current state below.

    Current state (this branch). `#print axioms SumProduct.sumProduct_false` reports exactly `propext`,
    `Classical.choice`, and `Quot.sound`; Martinet's Theorem 3.2 is the explicit hypothesis
    `SumProduct.MartinetTotallyRealTowers`, not a Lean axiom. The analytic inputs
    `partialCompletedZetaResidue_le` and
    `hensley_unitBox_volume`, together with `dedekindZeta_completed_ge_residue`,
    `dedekindZeta_completed_residue_le`, `dedekind_residue_le`, `regulator_le_discr`, and the Euler
    bound `dedekindZeta_two_re_le`, are proved theorems. `lake build` is clean. Auxiliary source
    searches find no additional `axiom` declarations and no suspicious metaprogramming or environment
    hooks (`unsafe`, custom macros/elabs, `run_cmd`, `implemented_by`). The headline theorem has
    additionally been verified with the comparator configuration `comparator/sum_product_false.json`,
    checking that the solution proves the same statement as the Mathlib-only `Challenge` wrapper,
    uses only the permitted axioms (`propext`, `Classical.choice`, `Quot.sound`), and is accepted by
    Lean's kernel. It has not been re-audited by a separate review session beyond these mechanical
    checks.

    Caveat: the audits were agent-assisted and not independent external peer review; they raise
    confidence in statement fidelity, axiom-boundary correctness, and internal consistency, but
    should not be treated as a substitute for expert third-party review.

# alignment - how source statements map to formal declarations.
alignment:
  namespace: "SumProduct"
  statements:
    - source: "Theorem 1.1 (sum-product false over ℝ)"
      lean: "SumProduct.sumProduct_false"
      module: "SumProduct.Construction"
      status: "proved"
    - source: "Theorem 1.2 (real-embedded form)"
      lean: "SumProduct.theorem_1_2"
      module: "SumProduct.Construction"
      status: "proved"
    - source: "Lemma 4.1 (construction A = G·P over 𝒪_K)"
      lean: "SumProduct.lemma_4_1"
      module: "SumProduct.Construction"
      status: "proved"
    - source: "Lemma 3.1 (regulator ≤ discriminant)"
      lean: "SumProduct.regulator_le_discr"
      module: "SumProduct.RegulatorBound"
      status: "proved"
      note: >-
        Proved from the residue bound `dedekind_residue_le`, Mathlib's analytic class number
        formula (`NumberField.dedekindZeta_residue`), and `h_K ≥ 1`.
    - source: "Louboutin-type residue bound (functional equation at s=2)"
      lean: "SumProduct.dedekind_residue_le"
      module: "SumProduct.RegulatorBound"
      status: "proved"
      note: >-
        `κ_K ≤ 2(2/π)^d √Δ_K`, proved by combining the residue bound
        `dedekindZeta_completed_residue_le` at `s = 2` with the proved Euler bound
        `dedekindZeta_two_re_le` (`ζ_K(2) ≤ 2^d`).
    - source: "Completed-zeta residue bound (totally real)"
      lean: "SumProduct.dedekindZeta_completed_residue_le"
      module: "SumProduct.RegulatorBound"
      status: "proved"
      note: >-
        `κ_K ≤ s(s-1)|Δ_K|^{(s-1)/2}π^{-ds/2}Γ(s/2)^d ζ_K(s)`, derived by specializing
        `dedekindZeta_completed_ge_residue` to totally real `K` (r₂=0) and dividing by `√|Δ_K|`.
    - source: "Inequality form: completed zeta exceeds its residue"
      lean: "SumProduct.dedekindZeta_completed_ge_residue"
      module: "SumProduct.RegulatorBound"
      status: "proved"
      note: >-
        `κ_K√|Δ|/π^{r₂} ≤ s(s-1)Λ_K(s)` for s>1 (general number field), by summing the per-class
        inequalities `partialCompletedZetaResidue_le`.
    - source: "Per-ideal residue inequality for the Dedekind zeta"
      lean: "SumProduct.partialCompletedZetaResidue_le"
      module: "SumProduct.PartialZetaMellin"
      status: "proved"
      note: >-
        For real s>1 and each nonzero ideal representative 𝔞,
        `(2^rR/w) ≤ s(s-1)·(DedekindZeta.completedPartialZeta K 𝔞 (s:ℂ)).re`. Proved in
        `SumProduct.PartialZetaMellin` using the in-repository `DedekindZeta` library (completed
        partial zetas and the theta inversion law `radialTheta_inversion`) plus Mathlib's analytic
        class number formula `NumberField.dedekindZeta_residue` (which pins the pole residue to 2^rR/w via
        `completedDedekindZeta_eq` + `ZInfty(1)=√|Δ|/π^{r₂}`, no geometric volume computation). The
        theta inversion reflects the dual tail's `Ioo 1 X` slice so the prefactor's polar deficit
        cancels into the clean pole plus nonnegative `u`-tails.
    # Dedekind-zeta support-library results in this repository:
    - source: "Dedekind zeta as a sum over integral ideals"
      lean: "DedekindZeta.dedekindZeta_eq_tsum_absNorm"
      module: "DedekindZeta.Statements"
      status: "proved"
      note: "`ζ_K(s) = ∑_{𝔞 ≠ 0} 𝔑(𝔞)^{-s}` for `1 < Re s`; agrees with Mathlib's `NumberField.dedekindZeta`."
    - source: "Per-class completed zeta as a theta/Mellin integral"
      lean: "DedekindZeta.completedPartialZeta_idealClassRep_eq"
      module: "DedekindZeta.PerClass"
      status: "proved"
      note: "Per ideal class `c`, `Z(c,s) = Z_∞(s) · (partial Dirichlet series over class c⁻¹)` on `1 < Re s`."
    - source: "Theta transformation/inversion law"
      lean: "DedekindZeta.ConeRadialReduction.radialTheta_inversion"
      module: "DedekindZeta.ConeRadialReduction"
      status: "proved"
      note: "`radialTheta 𝔞 (1/r) = (covolume 𝔞)⁻¹·r·radialThetaDual 𝔞 r`; the input that absorbs the prefactor into the clean pole."
    - source: "Agreement of the completed object with Mathlib's ζ_K on `Re s > 1`"
      lean: "DedekindZeta.completedDedekindZeta_eq"
      module: "DedekindZeta.PerClass"
      status: "proved"
      note: "`Λ_K(s) = Z_∞(s) · NumberField.dedekindZeta K s` for `1 < Re s` (used to pin the residue via the class-number formula)."
    - source: "Euler-product bound of ζ_K (ζ_K(2) ≤ 2^d)"
      lean: "SumProduct.dedekindZeta_two_re_le"
      module: "SumProduct.EulerBound"
      status: "proved"
      note: >-
        `(dedekindZeta K 2).re ≤ 2^d`, proved: the ideal-counting
        function `a_n = #{ideals of norm n}` is multiplicative and bounded by the d-fold divisor
        function `ζ^d`, whose L-series is `riemannZeta^d`; with `riemannZeta 2 = π²/6 ≤ 2`.
    - source: "Theorem 3.2 (Martinet totally real towers)"
      lean: "SumProduct.MartinetTotallyRealTowers"
