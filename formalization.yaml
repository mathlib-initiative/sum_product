        3. Convergence, not a single transcript. Unlike the interactive Claude Code phases, this phase
        ran many short-lived agents concurrently to convergence under the orchestrator; the human's role
        was authoring the spec and setting the no-sorry / faithful-statement bar, not step-by-step
        steering.
