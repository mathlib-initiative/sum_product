description: |
  Entrypoint for the formalization of the paper *"The sum-product conjecture is
  false for real numbers"* (source paper: see `tasks/source/README.md`).

  **Goal — Theorem 1.1.** Formalize a complete, machine-checked proof of:

  > There exists an absolute constant $c > 0$ such that there are arbitrarily
  > large finite $A \subset \mathbb{R}$ with
  > $$\max\bigl(\lvert A+A\rvert,\ \lvert AA\rvert\bigr) \leq \lvert A\rvert^{\,2-c}.$$

  i.e. the sum-product conjecture $\max(\lvert A+A\rvert,\lvert AA\rvert) \geq
  \lvert A\rvert^{2-o(1)}$ is **false** over $\mathbb{R}$.

  **Current assumption boundary.** Lemma 3.1 is now proved in
  `SumProduct.RegulatorBound`; equation (3.1) and the §3 lattice counts are also
  proved. The only remaining mathematical input is the explicit hypothesis
  **Theorem 3.2** (Martinet), `SumProduct.MartinetTotallyRealTowers`: there is an absolute
  constant $C > 0$ such that for infinitely many $d$ there exist totally real number fields $K$ of
  degree $d$ with $\Delta_K \leq C^d$.

  **Scope.** Everything on the path from Martinet's theorem to Theorem 1.1: the
  reduction of Theorem 1.1 to the general construction (Theorem 1.2 / §4), the
  regulator bound, the additive and multiplicative lattice bounds, and the
  numerical/counting estimates.
